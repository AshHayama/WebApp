<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Air Hockey</title>
<style>
  :root {
    --bg: #0d1220;
    --fg: #e8ecf4;
    --muted: #8a93a6;
    --player: #4cc9f0;
    --cpu: #f72585;
    --panel: #161d2f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 28px; box-shadow: 0 12px 48px rgba(0,0,0,.55); }
  canvas.playing { cursor: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 12, 22, .72); backdrop-filter: blur(3px); padding: 16px;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: var(--panel); border: 1px solid #263049; border-radius: 18px;
    padding: 28px 28px 24px; width: min(340px, 100%); text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: .5px; }
  #msg { margin: 0 0 20px; color: var(--muted); font-size: 15px; min-height: 1.3em; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .diff { display: flex; gap: 6px; margin-bottom: 22px; }
  .diff button {
    flex: 1; padding: 9px 0; border-radius: 10px; border: 1px solid #2c3754;
    background: transparent; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer;
  }
  .diff button.on { background: #24304d; border-color: var(--player); }
  #play {
    width: 100%; padding: 13px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--player); color: #04121a; font: inherit; font-weight: 700; font-size: 16px;
  }
  #play:hover { filter: brightness(1.08); }
  .hint { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="overlay">
  <div class="panel">
    <h1>Air Hockey</h1>
    <p id="msg">First to 7 wins</p>
    <div class="label">Difficulty</div>
    <div class="diff" id="diff">
      <button data-d="easy">Easy</button>
      <button data-d="medium" class="on">Medium</button>
      <button data-d="hard">Hard</button>
    </div>
    <button id="play">Play</button>
    <div class="hint">Move your mouse or finger to control the blue mallet.<br>Press Esc or P to pause.</div>
  </div>
</div>

<script>
(() => {
  // ---- Table dimensions (logical units; canvas is scaled to fit) ----
  const W = 400, H = 700;
  const GOAL = 150;          // goal mouth width
  const PR = 16;             // puck radius
  const MR = 28;             // mallet radius
  const WIN = 7;
  const MAX_PUCK = 24;       // max puck speed (units per frame @60fps)
  const SUBSTEPS = 6;

  const DIFFS = {
    easy:   { speed: 3.6, aim: 0.4, defend: 0.45 },
    medium: { speed: 5.6, aim: 0.7, defend: 0.65 },
    hard:   { speed: 8.5, aim: 1.0, defend: 0.85 },
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const playBtn = document.getElementById('play');

  let scale = 1;
  let difficulty = 'medium';
  let state = 'menu';        // menu | play | goal | pause | over
  let goalTimer = 0;
  let lastScorer = null;
  const score = { p: 0, c: 0 };

  const puck = { x: W / 2, y: H / 2, vx: 0, vy: 0, trail: [] };
  const player = { x: W / 2, y: H - 90, vx: 0, vy: 0, tx: W / 2, ty: H - 90 };
  const cpu = { x: W / 2, y: 90, vx: 0, vy: 0 };

  // ---- Helpers ----
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  function stepToward(m, tx, ty, maxStep) {
    const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy);
    if (d <= maxStep || d === 0) return [tx, ty];
    return [m.x + dx / d * maxStep, m.y + dy / d * maxStep];
  }

  // ---- Sound ----
  let ac = null, lastHit = 0;
  function tone(freq, dur = 0.06, vol = 0.15, type = 'triangle') {
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur);
  }
  function hitSound(strength) {
    const now = performance.now();
    if (now - lastHit < 40) return;
    lastHit = now;
    tone(380 + strength * 18, 0.05, clamp(0.05 + strength * 0.015, 0.05, 0.3));
  }

  // ---- Layout ----
  function resize() {
    const pad = 24;
    scale = Math.min((innerWidth - pad) / W, (innerHeight - pad) / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---- Input ----
  function setTarget(e) {
    const r = canvas.getBoundingClientRect();
    player.tx = (e.clientX - r.left) / scale;
    player.ty = (e.clientY - r.top) / scale;
  }
  addEventListener('pointermove', setTarget);
  addEventListener('pointerdown', setTarget);

  addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (state === 'play' || state === 'goal') pause();
      else if (state === 'pause') resume();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && (state === 'play' || state === 'goal')) pause();
  });

  document.getElementById('diff').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    difficulty = b.dataset.d;
    for (const x of document.querySelectorAll('#diff button')) x.classList.toggle('on', x === b);
  });

  playBtn.addEventListener('click', () => {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
    }
    if (state === 'pause') resume(); else newGame();
  });

  let prevState = 'play';
  function pause() {
    prevState = state; state = 'pause';
    msg.textContent = `Paused — You ${score.p} : ${score.c} CPU`;
    playBtn.textContent = 'Resume';
    showOverlay(true);
  }
  function resume() {
    state = prevState;
    showOverlay(false);
  }
  function showOverlay(on) {
    overlay.classList.toggle('hidden', !on);
    canvas.classList.toggle('playing', !on);
  }

  // ---- Game flow ----
  function newGame() {
    score.p = score.c = 0;
    player.x = player.tx = W / 2; player.y = player.ty = H - 90;
    cpu.x = W / 2; cpu.y = 90;
    resetPuck(Math.random() < 0.5 ? 'p' : 'c');
    state = 'play';
    showOverlay(false);
  }

  // Puck is placed in the half of whoever just conceded.
  function resetPuck(side) {
    puck.x = W / 2;
    puck.y = side === 'p' ? H / 2 + 90 : H / 2 - 90;
    puck.vx = puck.vy = 0;
    puck.trail.length = 0;
  }

  function goal(scorer) {
    score[scorer]++;
    lastScorer = scorer;
    tone(scorer === 'p' ? 660 : 220, 0.35, 0.25, 'sine');
    if (score[scorer] >= WIN) {
      state = 'over';
      msg.textContent = scorer === 'p'
        ? `You win ${score.p}–${score.c}!`
        : `CPU wins ${score.c}–${score.p}. Try again?`;
      playBtn.textContent = 'Play again';
      showOverlay(true);
      return;
    }
    state = 'goal';
    goalTimer = 70;
  }

  // ---- CPU AI ----
  function cpuTarget() {
    const d = DIFFS[difficulty];
    const homeY = 70;
    const inCpuHalf = puck.y < H / 2;

    if (inCpuHalf) {
      if (puck.y < cpu.y - 4) {
        // Puck is behind the mallet: go around it instead of knocking it into own goal.
        const side = puck.x < W / 2 ? 1 : -1;
        if (puck.y < PR + MR + 6) return [puck.x + side * (PR + MR + 2), puck.y]; // near wall: push sideways
        return [puck.x + side * (MR + PR) * 0.8, puck.y - (MR + PR) - 6];
      }
      // Strike: approach from behind the puck along a line toward the player's goal.
      const gx = W / 2, gy = H + 40;
      let ax = gx - puck.x, ay = gy - puck.y;
      const al = Math.hypot(ax, ay) || 1;
      ax /= al; ay /= al;
      const off = 10 * d.aim;
      return [puck.x - ax * off, puck.y - ay * off];
    }
    // Defend: shadow the puck horizontally near the goal.
    return [W / 2 + (puck.x - W / 2) * d.defend, homeY];
  }

  // ---- Physics ----
  function collide(m) {
    const dx = puck.x - m.x, dy = puck.y - m.y;
    const d = Math.hypot(dx, dy), min = PR + MR;
    if (d >= min) return;
    let nx, ny;
    if (d === 0) { nx = 0; ny = m === cpu ? 1 : -1; } else { nx = dx / d; ny = dy / d; }
    puck.x = m.x + nx * min;
    puck.y = m.y + ny * min;
    const rvx = puck.vx - m.vx, rvy = puck.vy - m.vy;
    const dot = rvx * nx + rvy * ny;
    if (dot < 0) {
      const e = 0.9;
      puck.vx -= (1 + e) * dot * nx;
      puck.vy -= (1 + e) * dot * ny;
      hitSound(-dot);
    }
  }

  // Returns a scorer key if the puck went in, else null.
  function walls() {
    const half = GOAL / 2;
    const inMouth = Math.abs(puck.x - W / 2) < half;
    const bounce = 0.88;

    // Inside the goal pocket: keep it between the posts.
    if (puck.y < 0 || puck.y > H) {
      puck.x = clamp(puck.x, W / 2 - half + PR, W / 2 + half - PR);
    } else {
      if (puck.x < PR) { puck.x = PR; puck.vx = Math.abs(puck.vx) * bounce; wallSound(); }
      if (puck.x > W - PR) { puck.x = W - PR; puck.vx = -Math.abs(puck.vx) * bounce; wallSound(); }
    }

    if (puck.y < PR && !inMouth) { puck.y = PR; puck.vy = Math.abs(puck.vy) * bounce; wallSound(); }
    if (puck.y > H - PR && !inMouth) { puck.y = H - PR; puck.vy = -Math.abs(puck.vy) * bounce; wallSound(); }

    if (puck.y < -PR) return 'p';
    if (puck.y > H + PR) return 'c';
    return null;
  }
  function wallSound() {
    const s = Math.hypot(puck.vx, puck.vy);
    if (s > 1.5) hitSound(s * 0.5);
  }

  function update(dt) {
    if (state === 'goal') {
      goalTimer -= dt;
      // Let mallets drift back while waiting.
      moveMallets(dt, true);
      if (goalTimer <= 0) {
        resetPuck(lastScorer === 'p' ? 'c' : 'p');
        state = 'play';
      }
      return;
    }
    if (state !== 'play') return;

    const { pPrev, pNext, cPrev, cNext } = moveMallets(dt, false);

    for (let s = 1; s <= SUBSTEPS; s++) {
      const f = s / SUBSTEPS;
      player.x = lerp(pPrev[0], pNext[0], f); player.y = lerp(pPrev[1], pNext[1], f);
      cpu.x = lerp(cPrev[0], cNext[0], f);    cpu.y = lerp(cPrev[1], cNext[1], f);
      puck.x += puck.vx * dt / SUBSTEPS;
      puck.y += puck.vy * dt / SUBSTEPS;
      collide(player);
      collide(cpu);
      const scorer = walls();
      if (scorer) { goal(scorer); return; }
    }

    // Air-table friction + speed cap
    const fr = Math.pow(0.996, dt);
    puck.vx *= fr; puck.vy *= fr;
    const sp = Math.hypot(puck.vx, puck.vy);
    if (sp > MAX_PUCK) { puck.vx *= MAX_PUCK / sp; puck.vy *= MAX_PUCK / sp; }

    puck.trail.push([puck.x, puck.y]);
    if (puck.trail.length > 10) puck.trail.shift();
  }

  function moveMallets(dt, idle) {
    const pPrev = [player.x, player.y], cPrev = [cpu.x, cpu.y];

    // Player follows pointer, limited to own half.
    const ptx = clamp(player.tx, MR, W - MR);
    const pty = clamp(player.ty, H / 2 + MR, H - MR);
    const pNext = stepToward(player, ptx, pty, 32 * dt);

    // CPU
    let [ctx_, cty] = idle ? [W / 2, 70] : cpuTarget();
    ctx_ = clamp(ctx_, MR, W - MR);
    cty = clamp(cty, MR, H / 2 - MR);
    const cNext = stepToward(cpu, ctx_, cty, DIFFS[difficulty].speed * dt);

    player.vx = (pNext[0] - pPrev[0]) / dt; player.vy = (pNext[1] - pPrev[1]) / dt;
    cpu.vx = (cNext[0] - cPrev[0]) / dt;    cpu.vy = (cNext[1] - cPrev[1]) / dt;

    if (idle) { [player.x, player.y] = pNext; [cpu.x, cpu.y] = cNext; }
    return { pPrev, pNext, cPrev, cNext };
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawTable() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b2440');
    g.addColorStop(0.5, '#202b4c');
    g.addColorStop(1, '#1b2440');
    roundRect(0, 0, W, H, 28);
    ctx.fillStyle = g;
    ctx.fill();

    // Markings
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 5, 0, Math.PI * 2); ctx.fill();

    // Goal creases
    ctx.strokeStyle = 'rgba(247,37,133,.35)';
    ctx.beginPath(); ctx.arc(W / 2, 0, GOAL / 2 + 20, 0, Math.PI); ctx.stroke();
    ctx.strokeStyle = 'rgba(76,201,240,.35)';
    ctx.beginPath(); ctx.arc(W / 2, H, GOAL / 2 + 20, Math.PI, Math.PI * 2); ctx.stroke();

    // Goals
    ctx.fillStyle = '#05070d';
    roundRect(W / 2 - GOAL / 2, -10, GOAL, 18, 8); ctx.fill();
    roundRect(W / 2 - GOAL / 2, H - 8, GOAL, 18, 8); ctx.fill();

    // Rim
    roundRect(1.5, 1.5, W - 3, H - 3, 27);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.15)';
    ctx.stroke();

    // Scores
    ctx.font = '700 64px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(247,37,133,.22)';
    ctx.fillText(score.c, W - 22, H / 2 - 50);
    ctx.fillStyle = 'rgba(76,201,240,.22)';
    ctx.fillText(score.p, W - 22, H / 2 + 54);
  }

  function drawMallet(m, color) {
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 18;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(m.x, m.y, MR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.72, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(m.x - 4, m.y - 4, MR * 0.18, 0, Math.PI * 2); ctx.fill();
  }

  function drawPuck() {
    const t = puck.trail;
    for (let i = 0; i < t.length; i++) {
      const a = (i / t.length) * 0.25;
      ctx.fillStyle = `rgba(255,214,102,${a})`;
      ctx.beginPath(); ctx.arc(t[i][0], t[i][1], PR * (0.5 + i / t.length * 0.5), 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    ctx.shadowColor = '#ffd666'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffd666';
    ctx.beginPath(); ctx.arc(puck.x, puck.y, PR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(puck.x, puck.y, PR * 0.6, 0, Math.PI * 2); ctx.stroke();
  }

  function drawGoalBanner() {
    if (state !== 'goal') return;
    const a = Math.min(1, goalTimer / 20);
    ctx.globalAlpha = a;
    ctx.font = '800 48px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = lastScorer === 'p' ? '#4cc9f0' : '#f72585';
    ctx.fillText(lastScorer === 'p' ? 'GOAL!' : 'CPU SCORES', W / 2, H / 2);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    roundRect(0, 0, W, H, 28);
    ctx.clip();
    drawTable();
    if (state !== 'goal') drawPuck();
    drawMallet(cpu, '#f72585');
    drawMallet(player, '#4cc9f0');
    drawGoalBanner();
    ctx.restore();
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = clamp((now - last) / (1000 / 60), 0.1, 3); // in 60fps frames
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
